<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2a1c10">
<title>پنل اشتراک</title>
<style>
:root{
  --page:#2a1c10;--ink:#2b1d10;--muted:#6e5a3f;--card1:#dbc9a3;--card2:#cdb88c;--edge:#8d6d41;--line:#a98a5b;
  --green:#243b2e;--green2:#1f3a2b;--cream:#efe3c4;--brown:#6a4a2c;--tan:#cdb68a;--tan-edge:#a58a5c;--tile:rgba(255,248,226,.22);
  --ok:#4fe0a0;--bad:#c0502f;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .24 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
[data-theme=light]{--page:#e9dec4;--card1:#e9dcbb;--card2:#decca2;--muted:#6b5838}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--page) var(--noise);color:var(--ink);font-family:Vazirmatn,Vazir,IRANSansX,Estedad,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 130px}

/* hero */
.hero{position:relative;height:250px;margin:0 -14px;overflow:hidden;background:linear-gradient(#6a563a 0%,#b39461 55%,#7a6038 100%)}
.hero.img{background-size:cover;background-position:center}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:linear-gradient(transparent,var(--page))}
.hero svg.fv{position:absolute;left:50%;top:52px;width:340px;margin-left:-170px;opacity:.92}
.hero .sun{position:absolute;left:50%;top:80px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:radial-gradient(#f0d9a0 0%,rgba(240,217,160,0) 68%);opacity:.55}
.top{position:absolute;z-index:2;inset:14px 14px auto 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.brand b{display:block;font-size:20px;line-height:1.25}
.brand small{display:block;font-size:13px;opacity:.9;line-height:1.2}
.sq-g{width:46px;height:46px;border-radius:15px;background:var(--green);border:1px solid rgba(255,255,255,.18);color:var(--cream);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.circs{display:flex;gap:8px}
.circ{width:42px;height:42px;border-radius:50%;background:rgba(40,30,20,.62);color:var(--cream);display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(2px);text-decoration:none}

/* notice */
.notice{position:relative;z-index:3;margin:-34px 0 14px;border-radius:999px;background:var(--card1) var(--noise);border:3px solid var(--edge);box-shadow:inset 0 0 0 4px var(--card2),inset 0 0 0 5px var(--line),0 6px 16px rgba(0,0,0,.35);padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-weight:600;font-size:14px}
.notice svg{color:#7a5a30;width:20px;height:20px}

/* cards */
.card{position:relative;background:var(--card1) var(--noise);border:3px solid var(--edge);border-radius:28px;box-shadow:inset 0 0 0 5px var(--card2),inset 0 0 0 6px var(--line),0 8px 22px rgba(0,0,0,.4);padding:22px 18px;margin-bottom:14px}
.card h2{margin:0;font-size:22px;line-height:1.3}
.card .sub{margin:2px 0 14px;color:var(--muted);font-size:14px}
.tile{position:relative;background:var(--tile);border:2px solid var(--line);border-radius:20px;box-shadow:inset 0 0 0 3px rgba(205,184,140,.55),inset 0 0 0 4px var(--line);padding:13px 14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 16px;font-weight:700;font-size:14px;background:var(--green);color:var(--cream)}
.chip i{width:9px;height:9px;border-radius:50%;background:#fff;display:block}
.chip.bad{background:#6a2a18}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.tag{background:var(--tan);border:1.5px solid var(--tan-edge);color:#5b4426;border-radius:999px;padding:3px 14px;font-weight:600;font-size:13px}
.uname-l{color:var(--muted);font-size:14px}
.uname{font-size:32px;font-weight:800;line-height:1.2;word-break:break-all;margin:0 0 14px}
.btns{display:flex;gap:10px;margin-bottom:14px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;font-weight:700;font-size:14px;padding:0 10px;white-space:nowrap;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--green);color:var(--cream)}
.btn.light{background:#e6d6af;color:var(--ink);border:2px solid var(--tan-edge)}
.btn.full{width:100%;flex:none}
.tile .l{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#4b3820;font-weight:600;font-size:14px}
.tile .l svg{color:#7a5a30;width:26px;height:26px}
.tile .v{font-weight:800;font-size:17px;margin-top:6px;line-height:1.35}
.tile.c{text-align:center}
.tile.c svg{color:#6b4d2a;width:30px;height:30px;display:block;margin:0 auto 4px}
.tile.c .l{display:block;color:#3b2a14;font-weight:800;font-size:14px}
.tile.c .v{font-size:15px;margin-top:2px}
.ttl{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:20px;margin:2px 0 14px}
.ttl:before,.ttl:after{content:"";flex:1;height:2px;background:var(--line);opacity:.8}
.ttl span:before,.ttl span:after{content:"❦";color:#7a5a30;font-size:15px;margin:0 8px}
.usage{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring text{font-family:inherit}
.rose{width:120px;height:120px;opacity:.55;flex:none}
.split{display:grid;grid-template-columns:1fr 2px 1fr;align-items:center;text-align:center;margin:16px 0 12px}
.split .bar{height:56px;background:var(--line)}
.split small{display:block;color:var(--muted);font-weight:600}
.split b{font-size:17px}
.dots{display:flex;justify-content:space-between;gap:3px;margin:6px 4px}
.dots i{flex:1;max-width:28px;aspect-ratio:1;border-radius:50%;background:#bba983;border:2px solid #a7916a}
.dots i.on{background:#2c5a41;border-color:#1f3a2b}
.tot{text-align:center;font-weight:600;margin-top:8px}
.stat .v{font-size:14px;line-height:1.3;margin-top:4px}
.stat .l{display:block;font-size:13px;font-weight:700;color:#3b2a14;margin-top:6px}

/* rows (configs) */
.row{margin-bottom:12px;padding:12px 12px 12px}
.rt{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sq{width:46px;height:46px;border-radius:14px;background:var(--green);color:var(--cream);display:grid;place-items:center;flex:none}
.sq svg{width:22px;height:22px}
.rn{flex:1;min-width:0}
.rn b{display:block;font-size:17px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn small{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:#2f8a5a;display:inline-block}
.dot.off{background:#9a8a6a}
.pill{background:var(--green);color:var(--cream);border-radius:999px;padding:2px 12px;font-weight:700;font-size:12px;white-space:nowrap}
.pill.new{background:#7a4a1c}
.mini-row{display:grid;gap:8px}
.mini{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border-radius:14px;background:#c8b184;border:1.5px solid var(--tan-edge);color:#3b2a14;font-weight:700;font-size:12px}
.mini svg{width:19px;height:19px}
.mini.g{background:var(--green);border-color:#10241a;color:var(--cream)}
.mini[disabled]{opacity:.6;cursor:progress}
.hint{color:var(--muted);font-size:13px;margin:10px 2px 0}

/* apps */
.app{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding:16px}
.app .sq{width:52px;height:52px;border-radius:16px}
.app .sq svg{width:26px;height:26px}
.app .nm{font-size:22px;font-weight:800;line-height:1.2}
.app.me{border-color:#6d7f72}

/* nav */
.nav{position:fixed;z-index:20;inset:auto 0 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));display:flex;gap:9px;justify-content:center;pointer-events:none}
.nav>div{display:flex;gap:9px;width:100%;max-width:520px;pointer-events:auto}
.nb{flex:1;min-height:58px;border-radius:999px;background:var(--brown) var(--noise);border:2px solid #b0915c;color:#f3e4c0;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.45);padding:0 8px;white-space:nowrap;overflow:hidden}
.nb svg{width:21px;height:21px}
.nb.on{background:var(--green);border-color:#c7ae74}

/* sheet / toast */
#sheet{position:fixed;z-index:50;inset:0;background:rgba(15,9,3,.66);display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
.sh{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--card1) var(--noise);border:3px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:inset 0 0 0 5px var(--card2),inset 0 0 0 6px var(--line)}
.sh .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh .hd b{font-size:20px}
.x{width:40px;height:40px;border-radius:50%;background:#c8b184;border:1.5px solid var(--tan-edge);display:grid;place-items:center}
.qrbox{background:#fff;border-radius:18px;padding:10px;max-width:300px;margin:6px auto 12px;border:2px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.cap{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 8px}
.ai{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px}
.ai .rn b{white-space:normal}
.ai a.btn{flex:none;min-height:42px;padding:0 18px;font-size:14px}
#toast{position:fixed;z-index:60;left:50%;bottom:96px;transform:translate(-50%,16px);background:#1b120a;color:var(--cream);border:1.5px solid #b0915c;border-radius:999px;padding:10px 20px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;padding:26px 6px}
.empty h2{margin-bottom:6px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #a58a5c;border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
[dir=ltr] .ttl span:before,[dir=ltr] .ttl span:after{margin:0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero">
    <div class="sun"></div>
    <svg class="fv" id="fv" viewBox="0 0 300 170" aria-hidden="true"></svg>
    <div class="top">
      <div class="brand">
        <span class="sq-g"><button id="b-refresh" data-act="refresh" aria-label="refresh" style="display:grid;place-items:center;width:100%;height:100%"></button></span>
        <span><b id="brand"></b><small id="brandsub"></small></span>
      </div>
      <div class="circs">
        <a class="circ" id="b-support" data-act="support" href="#" aria-label="support"></a>
        <button class="circ" id="b-theme" data-act="theme" aria-label="theme"></button>
        <button class="circ" id="b-lang" data-act="lang" aria-label="language"></button>
      </div>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="app"><div class="card empty"><span class="spin"></span></div></main>
</div>
<nav class="nav"><div id="nav"></div></nav>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
var QR = (function () {
  'use strict';
  var ECC_PER_BLOCK = [
    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28]
  ];
  var NUM_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49]
  ];
  var FORMAT_BITS = [1, 0];

  function rawModules(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  function dataCodewords(ver, e) {
    return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[e][ver] * NUM_BLOCKS[e][ver];
  }
  function gfMul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11D);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }
  function rsDivisor(deg) {
    var res = [], i, j;
    for (i = 0; i < deg - 1; i++) res.push(0);
    res.push(1);
    var root = 1;
    for (i = 0; i < deg; i++) {
      for (j = 0; j < res.length; j++) {
        res[j] = gfMul(res[j], root);
        if (j + 1 < res.length) res[j] ^= res[j + 1];
      }
      root = gfMul(root, 2);
    }
    return res;
  }
  function rsRemainder(data, div) {
    var res = div.map(function () { return 0; });
    data.forEach(function (b) {
      var f = b ^ res.shift();
      res.push(0);
      div.forEach(function (c, i) { res[i] ^= gfMul(c, f); });
    });
    return res;
  }
  function alignPositions(ver) {
    if (ver === 1) return [];
    var n = Math.floor(ver / 7) + 2;
    var step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
    var res = [6];
    for (var pos = ver * 4 + 17 - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
    return res;
  }
  function bit(x, i) { return ((x >>> i) & 1) !== 0; }

  function encode(text, eccPref, forceMask) {
    var bytes = Array.prototype.slice.call(new TextEncoder().encode(text));
    var order = eccPref === 'L' ? [0] : [1, 0];
    var ver = 0, e = 0, found = false;
    for (var oi = 0; oi < order.length && !found; oi++) {
      for (var v = 1; v <= 40; v++) {
        var cap = dataCodewords(v, order[oi]) * 8;
        var need = 4 + (v < 10 ? 8 : 16) + bytes.length * 8;
        if (need <= cap) { ver = v; e = order[oi]; found = true; break; }
      }
    }
    if (!found) throw new Error('too long');
    var bits = [];
    function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
    put(4, 4);
    put(bytes.length, ver < 10 ? 8 : 16);
    bytes.forEach(function (b) { put(b, 8); });
    var capBits = dataCodewords(ver, e) * 8;
    put(0, Math.min(4, capBits - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (var pad = 0xEC; bits.length < capBits; pad ^= 0xEC ^ 0x11) put(pad, 8);
    var data = [];
    for (var i = 0; i < bits.length; i += 8) {
      var b = 0;
      for (var k = 0; k < 8; k++) b = (b << 1) | bits[i + k];
      data.push(b);
    }
    // ECC + interleave
    var nb = NUM_BLOCKS[e][ver], eccLen = ECC_PER_BLOCK[e][ver];
    var raw = Math.floor(rawModules(ver) / 8);
    var nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    var blocks = [], div = rsDivisor(eccLen), pos = 0;
    for (i = 0; i < nb; i++) {
      var dat = data.slice(pos, pos + shortLen - eccLen + (i < nShort ? 0 : 1));
      pos += dat.length;
      var ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var all = [];
    for (i = 0; i < blocks[0].length; i++) {
      for (var j = 0; j < blocks.length; j++) {
        if (i !== shortLen - eccLen || j >= nShort) all.push(blocks[j][i]);
      }
    }
    // matrix
    var size = ver * 4 + 17, m = [], fn = [];
    for (i = 0; i < size; i++) { m.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
    function setFn(x, y, d) { m[y][x] = d; fn[y][x] = true; }
    for (i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    function finder(cx, cy) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var dist = Math.max(Math.abs(dx), Math.abs(dy)), xx = cx + dx, yy = cy + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFn(xx, yy, dist !== 2 && dist !== 4);
      }
    }
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    var ap = alignPositions(ver), na = ap.length;
    for (i = 0; i < na; i++) for (j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++)
        setFn(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    function drawFormat(mask) {
      var d = (FORMAT_BITS[e] << 3) | mask, rem = d;
      for (var q = 0; q < 10; q++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      var bitsF = ((d << 10) | rem) ^ 0x5412, t;
      for (t = 0; t <= 5; t++) setFn(8, t, bit(bitsF, t));
      setFn(8, 7, bit(bitsF, 6)); setFn(8, 8, bit(bitsF, 7)); setFn(7, 8, bit(bitsF, 8));
      for (t = 9; t < 15; t++) setFn(14 - t, 8, bit(bitsF, t));
      for (t = 0; t < 8; t++) setFn(size - 1 - t, 8, bit(bitsF, t));
      for (t = 8; t < 15; t++) setFn(8, size - 15 + t, bit(bitsF, t));
      setFn(8, size - 8, true);
    }
    drawFormat(0);
    if (ver >= 7) {
      var rem = ver;
      for (i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      var vb = (ver << 12) | rem;
      for (i = 0; i < 18; i++) {
        var col = bit(vb, i), a = size - 11 + i % 3, bb = Math.floor(i / 3);
        setFn(a, bb, col); setFn(bb, a, col);
      }
    }
    // codewords
    var idx = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < size; vert++) {
        for (j = 0; j < 2; j++) {
          var x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
          if (!fn[y][x] && idx < all.length * 8) { m[y][x] = bit(all[idx >>> 3], 7 - (idx & 7)); idx++; }
        }
      }
    }
    function applyMask(mask) {
      for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) {
        var inv;
        switch (mask) {
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;

function parseConf(txt) {
  var sec = '', o = { i: {}, p: {} };
  String(txt).split(/\r?\n/).forEach(function (l) {
    l = l.trim();
    if (!l || l[0] === '#') return;
    var m = l.match(/^\[(\w+)\]$/);
    if (m) { sec = m[1].toLowerCase(); return; }
    var k = l.indexOf('=');
    if (k < 0) return;
    var key = l.slice(0, k).trim().toLowerCase(), val = l.slice(k + 1).trim();
    if (sec === 'interface') o.i[key] = val; else if (sec === 'peer' && !(key in o.p)) o.p[key] = val;
  });

}
function toWgUri(txt, name) {
  var c = parseConf(txt), m = (c.p.endpoint || '').match(/^(\[[^\]]+\]|[^:]+):(\d+)$/);

  var qs = ['publickey=' + encodeURIComponent(c.p.publickey)];
  if (c.i.address) qs.push('address=' + encodeURIComponent(c.i.address.replace(/\s+/g, '')).replace(/%2C/gi, ','));
  if (c.i.mtu) qs.push('mtu=' + encodeURIComponent(c.i.mtu));
  if (c.p.presharedkey) qs.push('presharedkey=' + encodeURIComponent(c.p.presharedkey));
  if (c.p.persistentkeepalive) qs.push('keepalive=' + encodeURIComponent(c.p.persistentkeepalive));

}

/* supportHref turns the operator's free-text support contact into a link:
   a full URL stays as it is, an @handle becomes a Telegram link, a bare
   email a mailto: link, a phone number a tel: link, a bare username a
   Telegram link, and a bare domain gains https://. Anything else is
   not a link at all, and the caller falls back to plain text. */
function supportHref(sc) {
  if (!sc) return '';
  sc = String(sc).trim();
  if (!sc) return '';
  if (/^(https?:|tel:|mailto:|tg:)/i.test(sc)) return sc;
  if (/^@/.test(sc)) return 'https://t.me/' + sc.slice(1);
  if (/^[\w.+-]+@[\w-]+\.[a-z]{2,}$/i.test(sc)) return 'mailto:' + sc;
  if (/^\+?[\d\s-]{6,}$/.test(sc)) return 'tel:' + sc.replace(/\s+/g, '');
  if (/^[\w.-]+\.[a-z]{2,}/i.test(sc)) return 'https://' + sc;
  if (/^[\w]{5,}$/.test(sc)) return 'https://t.me/' + sc;
  return '';
}

  var sc = S.info && S.info.support_contact, a = $('b-support');
  if (sc) {
    var href = supportHref(sc);
    a.href = href || '#'; a.target = href && /^https?:/.test(href) ? '_blank' : ''; a.rel = 'noopener noreferrer';
    a.dataset.has = href ? '1' : '';
  } else { a.href = '#'; a.dataset.has = ''; }
  document.title = (S.info && S.info.label ? S.info.label + ' · ' : '') + t('brandSub');
}

function nodeAt(btn) { var i = Number(btn.getAttribute('data-i')); return { n: S.nodes[i], i: i }; }
function withNode(btn, fn) {
  var o = nodeAt(btn); if (!o.n) return;
  btn.setAttribute('disabled', '');
  getConfig(o.n, 'n' + o.i).then(function (txt) { btn.removeAttribute('disabled'); fn(txt, o.n, o.i); })
    .catch(function () { btn.removeAttribute('disabled'); toast(t('cfgErr')); });
}
function openV2(uri) {

}
function nodeUri(txt, n, i) { return toWgUri(txt, (S.info && S.info.label ? S.info.label + ' ' : '') + (n.name || ('#' + (i + 1)))) || linkUri(txt); }
function recNode() {
  var idx = -1; S.nodes.forEach(function (n, i) { if (n.recommended && idx < 0) idx = i; });
  if (idx < 0) idx = 0;
  return { n: S.nodes[idx], i: idx };
}
function onClick(e) {
  var b = e.target.closest('[data-act]');
  if (!b) { if (e.target.id === 'sheet') closeSheet(); return; }
  var act = b.getAttribute('data-act');
  switch (act) {
    case 'tab': S.tab = b.getAttribute('data-t'); try { history.replaceState(null, '', '#' + S.tab); } catch (x) {} render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'refresh': S.cache = {}; load(); break;
    case 'more-nodes': S.showN = (S.showN || 6) + 6; render(); break;
    case 'theme': S.theme = S.theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem('wgsub.theme', S.theme); } catch (x) {} render(); break;
    case 'lang': S.lang = S.lang === 'fa' ? 'en' : 'fa'; try { localStorage.setItem('wgsub.lang', S.lang); } catch (x) {} render(); break;
    case 'support': if (!b.dataset.has) { e.preventDefault(); toast(t('noSupport')); } break;
    case 'close': closeSheet(); break;
    case 'copy-link': doCopy(pageLink()); break;
    case 'qr-link': showQr(t('qrLink'), pageLink(), t('qrLinkCap')); break;
    case 'app': openApps(b.getAttribute('data-p')); break;
    case 'node-dl': withNode(b, function (txt, n, i) {
      var isLink = !!linkUri(txt);
      // A WireGuard file does not travel as text: some Android browsers
      // take a text download at its word and save the tunnel as
      // Name.conf.txt, which no WireGuard app will import.
      var blob = new Blob([txt], { type: isLink ? 'text/plain;charset=utf-8' : 'application/octet-stream' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      // A link is not a WireGuard file: saving it as one would hand the
      // customer a .conf that no app can read as one.
      a.download = isLink ? cfgLegacyName(n, i).replace(/\.conf$/, '.txt') : cfgFileName(n, i);
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); toast(t('dled'));
    }); break;
    case 'node-copy': withNode(b, function (txt) { doCopy(txt); }); break;
    case 'node-qr': withNode(b, function (txt, n) { showQr(n.name || t('qr'), txt, linkUri(txt) ? t('qrCfgV2') : n.amnezia ? t('qrCfgAwg') : t('qrCfg')); }); break;
    case 'node-v2': withNode(b, function (txt, n, i) { var u = nodeUri(txt, n, i); if (u) openV2(u); else toast(t('cfgErr')); }); break;
    case 'v2-rec': { var r = recNode(); if (r.n) { toast(t('fetching')); getConfig(r.n, 'n' + r.i).then(function (txt) { if (r.n.amnezia) { var blob = new Blob([txt], { type: 'application/octet-stream' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = cfgFileName(r.n, r.i); document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); toast(t('dled')); return; } var u = nodeUri(txt, r.n, r.i); if (u) openV2(u); else toast(t('cfgErr')); }).catch(function () { toast(t('cfgErr')); }); } break; }
    case 'copy-all': toast(t('fetching')); Promise.all(S.nodes.map(function (n, i) { return getConfig(n, 'n' + i).then(function (txt) { return n.amnezia ? null : nodeUri(txt, n, i); }); }))
      .then(function (list) { var s = list.filter(Boolean).join('\n'); if (s) doCopy(s, t('v2boxTip')); else toast(t('cfgErr')); }).catch(function () { toast(t('cfgErr')); }); break;
    case 'v2-sub-add': { var s = v2boxSubLink(); if (s) { var nm = (S.info && S.info.label) || CFG.brand; var u = 'v2box://install-sub?url=' + encodeURIComponent(s) + '&name=' + encodeURIComponent(nm); doCopy(s, t('v2boxTip')).then(function () { location.href = u; }); } break; }
    case 'v2-sub-copy': { var s2 = v2boxSubLink(); if (s2) doCopy(s2); break; }
    case 'hid-add': { var hs = hiddifySubLink(); var hn = (S.info && S.info.label) || CFG.brand; var hu = 'hiddify://import/' + hs + '#' + encodeURIComponent(hn); fetch(hs).then(function (res) { if (!res.ok) { toast(t('cfgErr')); return; } doCopy(hs, t('hidTip')).then(function () { var pf = platform(); var store = pf === 'android' ? 'https://play.google.com/store/apps/details?id=app.hiddify.com' : pf === 'ios' ? 'https://apps.apple.com/app/hiddify-proxy-vpn/id6596777532' : 'https://github.com/hiddify/hiddify-app/releases/latest'; var gone = false; var mark = function () { gone = true; }; document.addEventListener('visibilitychange', mark); window.addEventListener('pagehide', mark); window.addEventListener('blur', mark); location.href = hu; setTimeout(function () { document.removeEventListener('visibilitychange', mark); window.removeEventListener('pagehide', mark); window.removeEventListener('blur', mark); if (!gone && !document.hidden) location.href = store; }, 2000); }); }).catch(function () { toast(t('cfgErr')); }); break; }
    case 'hid-copy': doCopy(hiddifySubLink()); break;
  }
}
